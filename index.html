<style>
/* ===== 基础 ===== */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --paper:      #FFF9E8;
  --paper-2:    #FCF0D8;
  --rule:       rgba(201, 102, 31, .12);
  --rule-deep:  rgba(201, 102, 31, .26);
  --ink:        #3B2E25;
  --ink-2:      #6E5A4B;
  --muted:      #9C8A7B;
  --orange:     #FFA64D;
  --clay:       #C9661F;
  --clay-dark:  #A65217;
  --blue:       #8FC7DE;
  --line:       rgba(59, 46, 37, .15);
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.75;
}

h1, h2, .serif {
  font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}

a { color: var(--clay); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 3px;
  border-radius: 2px;
}

[hidden] { display: none !important; }

/* ===== 页头 ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  padding: 10px 18px;
  background: var(--orange);
  border-bottom: 1px solid rgba(166, 82, 23, .35);
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #4A2A0C;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .04em;
  text-decoration: none;
}
.brand:hover { text-decoration: none; }

.avatar {
  display: block;
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 3px;
  object-fit: cover;
}

.hero-avatar {
  display: block;
  width: 128px;
  height: 128px;
  margin-bottom: 18px;
  border-radius: 6px;
}

.nav {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

.nav a {
  display: flex;
  align-items: center;
  min-height: 40px;
  padding: 0 12px;
  border-radius: 3px;
  color: #4A2A0C;
  font-size: 15px;
  text-decoration: none;
  transition: background-color .15s ease;
}
.nav a:hover { background: rgba(255, 249, 232, .38); text-decoration: none; }
.nav a[aria-current="page"] {
  background: var(--paper);
  color: var(--clay-dark);
  font-weight: 700;
}

/* ===== 开发者模式 ===== */
.devbtn {
  padding: 6px 12px;
  border: 1px solid rgba(74, 42, 12, .35);
  border-radius: 3px;
  background: rgba(255, 249, 232, .38);
  color: #4A2A0C;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.devbtn:hover { background: rgba(255, 249, 232, .65); }
.devbtn[data-on="true"] {
  background: var(--paper);
  border-color: var(--clay-dark);
  color: var(--clay-dark);
  font-weight: 700;
}

.dev-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.tl-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

[contenteditable="true"] {
  outline: 1px dashed rgba(201, 102, 31, .45);
  outline-offset: 4px;
  border-radius: 2px;
}

/* ===== 版面 ===== */
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 26px 18px 0;
}

.view { animation: fade .18s ease-out; }
.view[hidden] { display: none; }

@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

/* ===== 首页 ===== */
.hero {
  position: relative;
  padding: 30px 22px 26px 62px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background-color: var(--paper-2);
  background-image:
    linear-gradient(90deg, transparent 0 42px, var(--rule-deep) 42px 43px, transparent 43px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
}

.hero-name {
  margin: 0;
  font-size: clamp(38px, 10vw, 54px);
  font-weight: 700;
  letter-spacing: .06em;
  line-height: 1.15;
}

.hero-meta {
  margin: 10px 0 0;
  color: var(--ink-2);
  font-size: 15px;
}

.hero-meta .dash { color: var(--muted); }

.hero-note {
  margin: 16px 0 0;
  max-width: 32em;
  color: var(--ink-2);
  font-size: 15px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border: 1.5px solid var(--clay);
  border-radius: 3px;
  background: var(--clay);
  color: #FFF9E8;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease;
}
.btn:hover { background: var(--clay-dark); border-color: var(--clay-dark); }
.btn:active { transform: translateY(1px); }

.btn.ghost {
  background: transparent;
  color: var(--clay);
}
.btn.ghost:hover { background: rgba(201, 102, 31, .09); }



/* ===== 关于我 ===== */
.sec-title {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .03em;
}

.sec-lede {
  margin: 0 0 22px;
  color: var(--ink-2);
  font-size: 15px;
  max-width: 34em;
}

.timeline {
  display: grid;
  grid-template-columns: 76px 22px minmax(0, 1fr);
  row-gap: 24px;
  padding: 22px 18px 22px 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #FFFDF6;
}

.tl-date {
  align-self: start;
  padding-right: 8px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 20px;
  text-align: right;
  white-space: nowrap;
}

.tl-axis {
  position: relative;
  justify-self: center;
  width: 100%;
  display: flex;
  justify-content: center;
  min-height: 20px;
}

.tl-axis::before {
  content: "";
  position: absolute;
  top: 10px;
  bottom: -34px;
  left: 50%;
  width: 1.5px;
  margin-left: -.75px;
  background: var(--rule-deep);
}

.tl-axis .dot {
  position: relative;
  z-index: 1;
  width: 9px;
  height: 9px;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--clay);
  box-shadow: 0 0 0 3px var(--paper-2);
}

.timeline > .tl-axis:last-of-type::before { display: none; }

.tl-main { min-width: 0; }

.tl-title {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 17px;
  font-weight: 700;
  line-height: 20px;
}

.tl-desc {
  margin: 6px 0 0;
  color: var(--ink-2);
  font-size: 14.5px;
}

.tl-desc .muted { color: var(--muted); }

/* ===== 联系我 ===== */
.cards {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}

.card {
  padding: 18px 18px 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #FFFDF6;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--ink-2);
  font-size: 14px;
}

.card-head svg { flex: none; width: 18px; height: 18px; stroke: var(--clay); }

.card-value {
  display: block;
  margin-top: 8px;
  color: var(--ink);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .02em;
  overflow-wrap: anywhere;
  text-decoration: none;
}
.card-value:hover { color: var(--clay); text-decoration: none; }

.card-actions { margin-top: 12px; }

/* ===== 页脚 ===== */
.footer {
  max-width: 720px;
  margin: 34px auto 0;
  padding: 16px 18px 28px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
}

/* ===== 提示条 ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  z-index: 40;
  transform: translate(-50%, 12px);
  padding: 10px 18px;
  border-radius: 3px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== 点击涟漪 ===== */
.ripple {
  position: fixed;
  z-index: 30;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(143, 199, 222, .35);
  pointer-events: none;
  animation: rippleOut .65s ease-out forwards;
}

@keyframes rippleOut {
  0%   { transform: scale(.2); opacity: .75; }
  100% { transform: scale(2.6); opacity: 0; }
}

/* ===== 宽屏 ===== */
@media (min-width: 560px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 38px 34px 32px 74px; }
}

@media (prefers-reduced-motion: reduce) {
  .view, .ripple, .toast { animation: none !important; transition: none !important; }
  .ripple { display: none; }
}
</style>
</head>

<script>
(function () {
  'use strict';

  /* ---------- 视图切换 ---------- */
  var views = { home: null, about: null, contact: null };
  Object.keys(views).forEach(function (key) {
    views[key] = document.getElementById(key);
  });

  function currentKey() {
    var key = (location.hash || '#home').replace('#', '');
    return views[key] ? key : 'home';
  }

  function render() {
    var key = currentKey();
    Object.keys(views).forEach(function (name) {
      var on = name === key;
      views[name].hidden = !on;
      var link = document.getElementById('nav-' + name);
      if (on) { link.setAttribute('aria-current', 'page'); }
      else { link.removeAttribute('aria-current'); }
    });
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  render();

  /* ---------- 页面内容与开发者模式 ---------- */
  var CONTENT_KEY = 'lhr.content.v1';
  var DEV_PASSWORD = 'LHR_Web';
  var devMode = false;

  var DEFAULT_CONTENT = {
    hero: {
      name: '李赫然',
      meta: '2014.7.22 — ?',
      note: '时间轴上空余的部分 由我自己来书写'
    },
    timeline: [
      { date: '2014.7.22', title: '故事的起点', desc: '档案从这一天记起，后面接着写。', href: '' },
      { date: '小学', title: '青岛上清路小学', desc: '六年，从认字算起。',
        href: 'https://baike.baidu.com/item/%E9%9D%92%E5%B2%9B%E4%B8%8A%E6%B8%85%E8%B7%AF%E5%B0%8F%E5%AD%A6/10951173' },
      { date: '初中', title: '青岛第三十七中学', desc: '现在在这里。',
        href: 'https://baike.baidu.com/item/%E5%B1%B1%E4%B8%9C%E7%9C%81%E9%9D%92%E5%B2%9B%E7%AC%AC%E4%B8%89%E5%8D%81%E4%B8%83%E4%B8%AD%E5%AD%A6/49824109' },
      { date: '?', title: '未完待续', desc: '还没发生的事，不提前写。', href: '' }
    ],
    contact: { phone: '18561712310', phoneText: '185 6171 2310', email: '18561712310@163.com' }
  };

  function cloneObj(o) { return JSON.parse(JSON.stringify(o)); }

  function readContent() {
    var base = cloneObj(DEFAULT_CONTENT);
    try {
      var raw = localStorage.getItem(CONTENT_KEY);
      if (!raw) { return base; }
      var saved = JSON.parse(raw);
      if (saved && saved.hero) {
        if (typeof saved.hero.name === 'string') { base.hero.name = saved.hero.name; }
        if (typeof saved.hero.meta === 'string') { base.hero.meta = saved.hero.meta; }
        if (typeof saved.hero.note === 'string') { base.hero.note = saved.hero.note; }
      }
      if (saved && Array.isArray(saved.timeline)) {
        base.timeline = saved.timeline.map(function (t) {
          return {
            date: String(t.date || ''),
            title: String(t.title || ''),
            desc: String(t.desc || ''),
            href: String(t.href || '')
          };
        });
      }
      if (saved && saved.contact) {
        if (typeof saved.contact.phone === 'string') { base.contact.phone = saved.contact.phone; }
        if (typeof saved.contact.phoneText === 'string') { base.contact.phoneText = saved.contact.phoneText; }
        if (typeof saved.contact.email === 'string') { base.contact.email = saved.contact.email; }
      }
    } catch (err) { /* 读不到就用默认内容 */ }
    return base;
  }

  function saveContent() {
    try { localStorage.setItem(CONTENT_KEY, JSON.stringify(content)); } catch (err) {}
  }

  var content = readContent();

  var heroName = document.querySelector('.hero-name');
  var heroMeta = document.querySelector('.hero-meta');
  var heroNote = document.querySelector('.hero-note');
  var tlWrap = document.getElementById('timeline');
  var tlTools = document.getElementById('tl-tools');
  var cPhone = document.getElementById('contact-phone');
  var cEmail = document.getElementById('contact-email');
  var bindRow = document.getElementById('bind-row');
  var bindHint = document.getElementById('bind-state');
  var devBtn = document.getElementById('dev-toggle');

  function editField(el, apply) {
    if (!el) { return; }
    el.addEventListener('blur', function () {
      if (!devMode) { return; }
      apply();
      saveContent();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  }

  function renderTimeline() {
    tlWrap.textContent = '';

    content.timeline.forEach(function (item) {
      var date = document.createElement('div');
      date.className = 'tl-date';
      date.textContent = item.date;

      var axis = document.createElement('div');
      axis.className = 'tl-axis';
      axis.setAttribute('aria-hidden', 'true');
      var dot = document.createElement('span');
      dot.className = 'dot';
      axis.appendChild(dot);

      var main = document.createElement('div');
      main.className = 'tl-main';

      var title = document.createElement('p');
      title.className = 'tl-title';
      if (item.href) {
        var link = document.createElement('a');
        link.href = item.href;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = item.title;
        title.appendChild(link);
      } else {
        title.textContent = item.title;
      }

      var desc = document.createElement('p');
      desc.className = 'tl-desc';
      desc.textContent = item.desc;

      main.appendChild(title);
      main.appendChild(desc);

      if (devMode) {
        date.setAttribute('contenteditable', 'true');
        title.setAttribute('contenteditable', 'true');
        desc.setAttribute('contenteditable', 'true');

        editField(date, function () { item.date = date.textContent.trim(); });
        editField(title, function () {
          item.title = title.textContent.trim();
          if (item.href) { title.textContent = item.title; renderTimeline(); }
        });
        editField(desc, function () { item.desc = desc.textContent.trim(); });

        var row = document.createElement('div');
        row.className = 'dev-row';

        var linkBtn = document.createElement('button');
        linkBtn.type = 'button';
        linkBtn.className = 'linkbtn';
        linkBtn.textContent = item.href ? '改链接' : '加链接';
        linkBtn.addEventListener('click', function () {
          var url = prompt('这一段要链接到哪里？留空表示不要链接。', item.href || '');
          if (url === null) { return; }
          item.href = url.trim();
          saveContent();
          renderTimeline();
        });
        row.appendChild(linkBtn);

        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'linkbtn';
        delBtn.textContent = '删除这一段';
        delBtn.addEventListener('click', function () {
          var at = content.timeline.indexOf(item);
          if (at < 0) { return; }
          content.timeline.splice(at, 1);
          saveContent();
          renderTimeline();
        });
        row.appendChild(delBtn);

        main.appendChild(row);
      }

      tlWrap.appendChild(date);
      tlWrap.appendChild(axis);
      tlWrap.appendChild(main);
    });
  }

  function renderPage() {
    heroName.textContent = content.hero.name;
    heroMeta.textContent = content.hero.meta;
    heroNote.textContent = content.hero.note;

    cPhone.textContent = content.contact.phoneText;
    cPhone.href = 'tel:' + content.contact.phone;
    cEmail.textContent = content.contact.email;
    cEmail.href = 'mailto:' + content.contact.email;

    renderTimeline();

    [heroName, heroMeta, heroNote, cPhone, cEmail].forEach(function (el) {
      el.setAttribute('contenteditable', devMode ? 'true' : 'false');
    });

    tlTools.hidden = !devMode;
    if (bindRow) { bindRow.hidden = !devMode; }
    if (bindHint) { bindHint.hidden = !devMode; }
  }

  function paintDevBtn() {
    devBtn.textContent = devMode ? '退出开发者模式' : '开发者模式';
    devBtn.setAttribute('data-on', devMode ? 'true' : 'false');
  }

  devBtn.addEventListener('click', function () {
    if (devMode) {
      devMode = false;
      paintDevBtn();
      renderPage();
      showToast('已退出开发者模式');
      return;
    }
    var pwd = prompt('请输入密码：');
    if (pwd === null) { return; }
    if (pwd !== DEV_PASSWORD) {
      showToast('密码不对');
      return;
    }
    devMode = true;
    paintDevBtn();
    renderPage();
    showToast('开发者模式已开启，可以直接改页面内容');
  });

  document.getElementById('add-tl').addEventListener('click', function () {
    if (!devMode) { return; }
    content.timeline.push({ date: '某一年', title: '新的一段', desc: '', href: '' });
    saveContent();
    renderTimeline();
  });

  editField(heroName, function () { content.hero.name = heroName.textContent.trim(); });
  editField(heroMeta, function () { content.hero.meta = heroMeta.textContent.trim(); });
  editField(heroNote, function () { content.hero.note = heroNote.textContent.trim(); });
  editField(cPhone, function () {
    var text = cPhone.textContent.trim();
    content.contact.phoneText = text;
    content.contact.phone = text.replace(/[^0-9+]/g, '');
    cPhone.href = 'tel:' + content.contact.phone;
  });
  editField(cEmail, function () {
    content.contact.email = cEmail.textContent.trim();
    cEmail.href = 'mailto:' + content.contact.email;
  });

  paintDevBtn();
  renderPage();

  /* ---------- 提示条 ---------- */
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  /* ---------- 留言板 ---------- */
  var KEY = 'lhr.notes.v1';
  var memory = [];
  var panel = document.getElementById('notes');
  var input = document.getElementById('note-input');
  var list = document.getElementById('notes-list');
  var openBtn = document.getElementById('open-notes');

  function readNotes() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return memory.slice();
    }
  }

  function writeNotes(items) {
    memory = items.slice();
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
      return true;
    } catch (err) {
      return false;
    }
  }

  function stamp(ms) {
    var d = new Date(ms);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function drawNotes() {
    var items = readNotes().filter(function (n) { return !n.deleted; });
    list.textContent = '';

    if (!items.length) {
      var empty = document.createElement('p');
      empty.className = 'notes-empty';
      empty.textContent = '还没有留言，写第一句吧。';
      list.appendChild(empty);
      return;
    }

    items.slice().reverse().forEach(function (item) {
      var li = document.createElement('li');

      var body = document.createElement('p');
      body.className = 'notes-body';
      body.textContent = item.text;

      var foot = document.createElement('div');
      foot.className = 'notes-foot';

      var time = document.createElement('span');
      time.className = 'notes-time';
      time.textContent = stamp(item.at);

      var del = document.createElement('button');
      del.className = 'linkbtn';
      del.type = 'button';
      del.textContent = '删除';
      del.addEventListener('click', function () {
        var all = readNotes();
        var target = all.filter(function (n) { return n.id === item.id; })[0];
        if (!target) { return; }
        target.deleted = true;
        target.deletedAt = Date.now();
        writeNotes(all);
        drawNotes();
        syncBound(all);
        showToast('已删除');
      });

      foot.appendChild(time);
      foot.appendChild(del);
      li.appendChild(body);
      li.appendChild(foot);
      list.appendChild(li);
    });
  }

  openBtn.addEventListener('click', function () {
    panel.hidden = !panel.hidden;
    if (!panel.hidden) {
      input.focus();
      openBtn.textContent = '收起留言板';
    } else {
      openBtn.textContent = '给我留言';
    }
  });

  document.getElementById('save-note').addEventListener('click', function () {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      showToast('先写点什么');
      return;
    }
    var items = readNotes();
    items.push({ id: String(Date.now()) + Math.random().toString(16).slice(2, 6), text: text, at: Date.now() });
    writeNotes(items);
    input.value = '';
    drawNotes();
    syncBound(items);
    showToast('留好了，谢谢');
  });

  drawNotes();

  /* ---------- 导出为 Word 文档 ---------- */
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) { c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) { c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files) {
    var chunks = [];
    var central = [];
    var offset = 0;

    files.forEach(function (f) {
      var name = new TextEncoder().encode(f.name);
      var data = f.data;
      var crc = crc32(data);

      var lh = new Uint8Array(30 + name.length);
      var lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0x21, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      lh.set(name, 30);
      chunks.push(lh, data);

      var ch = new Uint8Array(46 + name.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x21, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);

      offset += lh.length + data.length;
    });

    var cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    var all = chunks.concat(central, [end]);
    var total = all.reduce(function (s, p) { return s + p.length; }, 0);
    var out = new Uint8Array(total);
    var pos = 0;
    all.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  function xmlEsc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function docRun(text, opt) {
    opt = opt || {};
    var rpr = '<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="' +
      (opt.font || '宋体') + '"/>' +
      (opt.bold ? '<w:b/>' : '') +
      (opt.strike ? '<w:strike/>' : '') +
      '<w:color w:val="' + (opt.color || '333333') + '"/>' +
      '<w:sz w:val="' + (opt.size || 24) + '"/></w:rPr>';
    return '<w:r>' + rpr + '<w:t xml:space="preserve">' + xmlEsc(text) + '</w:t></w:r>';
  }

  function docPara(runsXml, opt) {
    opt = opt || {};
    var ppr = '<w:pPr>' +
      (opt.align ? '<w:jc w:val="' + opt.align + '"/>' : '') +
      '<w:spacing w:before="' + (opt.before || 0) + '" w:after="' + (opt.after || 0) +
      '" w:line="320" w:lineRule="auto"/>' +
      (opt.indent ? '<w:ind w:left="' + opt.indent + '"/>' : '') +
      (opt.border ? '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="6" w:color="C9661F"/></w:pBdr>' : '') +
      '</w:pPr>';
    return '<w:p>' + ppr + runsXml + '</w:p>';
  }

  function buildDocx(opts) {
    var title = opts.title || '留言记录';
    var owner = opts.owner || '';
    var when = opts.when || '';
    var items = opts.items || [];

    var goneCount = items.filter(function (n) { return n.deleted; }).length;

    var body = '';
    body += docPara(docRun(title, { size: 44, bold: true, color: '3B2E25', font: '黑体' }), { after: 120 });
    body += docPara(
      docRun(owner, { size: 20, color: '9C8A7B' }) +
      docRun('　导出时间 ' + when, { size: 20, color: '9C8A7B' }) +
      docRun('　共 ' + items.length + ' 条' +
        (goneCount ? '（其中已删除 ' + goneCount + ' 条）' : ''), { size: 20, color: '9C8A7B' }),
      { after: 240, border: true }
    );

    items.forEach(function (item, i) {
      var no = ('0' + (i + 1)).slice(-2);
      var isGone = !!item.deleted;
      body += docPara(
        docRun(no, { size: 20, color: isGone ? '9C8A7B' : 'C9661F', bold: true }) +
        docRun('　' + (item.time || ''), { size: 20, color: '9C8A7B' }) +
        (isGone ? docRun('　已删除' + (item.deletedAt ? ' ' + item.deletedAt : ''),
                  { size: 20, color: 'A65217' }) : ''),
        { before: 240, after: 60 }
      );
      String(item.text).split(/\r?\n/).forEach(function (line) {
        body += docPara(docRun(line || ' ', {
          size: 24,
          color: isGone ? '9C8A7B' : '3B2E25',
          strike: isGone
        }), { indent: 240 });
      });
    });

    var sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1304" w:bottom="1440" w:left="1304" w:header="851" w:footer="992" w:gutter="0"/>' +
      '<w:docGrid w:linePitch="312"/></w:sectPr>';

    var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<w:body>' + body + sect + '</w:body></w:document>';

    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:docDefaults><w:rPrDefault><w:rPr>' +
      '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="宋体" w:cs="Times New Roman"/>' +
      '<w:sz w:val="24"/><w:szCs w:val="24"/>' +
      '</w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:line="320" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
      '</w:styles>';

    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '</Types>';

    var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    var docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    var enc = function (s) { return new TextEncoder().encode(s); };

    return makeZip([
      { name: '[Content_Types].xml', data: enc(contentTypes) },
      { name: '_rels/.rels', data: enc(rootRels) },
      { name: 'word/document.xml', data: enc(doc) },
      { name: 'word/_rels/document.xml.rels', data: enc(docRels) },
      { name: 'word/styles.xml', data: enc(styles) }
    ]);
  }

  function fileStamp() {
    var d = new Date();
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
  }

  document.getElementById('export-doc').addEventListener('click', function () {
    var items = readNotes().sort(function (a, b) { return a.at - b.at; });
    if (!items.length) {
      showToast('还没有留言，先写一条吧');
      return;
    }

    var doc = buildDocx({
      title: '留言记录',
      owner: '李赫然 · LHR_Web',
      when: stamp(Date.now()),
      items: items.map(function (n) {
        return {
          text: n.text,
          time: stamp(n.at),
          deleted: !!n.deleted,
          deletedAt: n.deleted ? stamp(n.deletedAt || n.at) : ''
        };
      })
    });

    var blob = new Blob([doc], {
      type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = '留言记录_' + fileStamp() + '.docx';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

    showToast('已导出 ' + items.length + ' 条留言');
  });

  /* ---------- 绑定一个固定文件，自动写入 ---------- */
  var DOCX_TYPE = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  var bindBtn = document.getElementById('bind-file');
  var bindState = document.getElementById('bind-state');
  var hasPicker = typeof window.showSaveFilePicker === 'function';
  var boundHandle = null;

  function idb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('lhr-web', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('handles'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbGet(key) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction('handles', 'readonly').objectStore('handles').get(key);
        t.onsuccess = function () { resolve(t.result || null); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }

  function idbSet(key, value) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction('handles', 'readwrite').objectStore('handles').put(value, key);
        t.onsuccess = function () { resolve(true); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }

  function docFor(items) {
    return buildDocx({
      title: '留言记录',
      owner: '李赫然 · LHR_Web',
      when: stamp(Date.now()),
      items: items.slice().sort(function (a, b) { return a.at - b.at; })
                  .map(function (n) {
                    return {
                      text: n.text,
                      time: stamp(n.at),
                      deleted: !!n.deleted,
                      deletedAt: n.deleted ? stamp(n.deletedAt || n.at) : ''
                    };
                  })
    });
  }

  function paintBind() {
    if (!hasPicker) {
      bindState.textContent = '当前浏览器不支持自动写入；用 Chrome 或 Edge 桌面版打开这个文件，就能绑定一个 Word 文档。';
      bindBtn.textContent = '绑定文件';
      return;
    }
    bindBtn.hidden = false;
    if (boundHandle) {
      bindState.textContent = '已绑定：' + boundHandle.name + '　每次保存都会自动写进去。';
      bindBtn.textContent = '更换文件';
    } else {
      bindState.textContent = '留言暂存在本机；绑定一个 Word 文件后，每次保存都会写进那个文件。';
      bindBtn.textContent = '绑定文件';
    }
  }

  async function ensurePerm(handle) {
    var opts = { mode: 'readwrite' };
    if ((await handle.queryPermission(opts)) === 'granted') { return true; }
    return (await handle.requestPermission(opts)) === 'granted';
  }

  async function syncBound(items, quiet) {
    if (!boundHandle) { return; }
    try {
      if (!(await ensurePerm(boundHandle))) {
        showToast('没有写入权限，点「更换文件」重新授权');
        return;
      }
      var stream = await boundHandle.createWritable();
      await stream.write(new Blob([docFor(items)], { type: DOCX_TYPE }));
      await stream.close();
      if (!quiet) { showToast('已写入 ' + boundHandle.name); }
    } catch (err) {
      showToast('写入失败：如果这个文件正在 Word 里打开，先关掉再试');
    }
  }

  bindBtn.addEventListener('click', async function () {
      if (!hasPicker) {
        showToast('当前浏览器不支持，请用 Chrome 打开这个文件');
        return;
      }
      try {
        var handle = await window.showSaveFilePicker({
          suggestedName: '留言记录.docx',
          types: [{
            description: 'Word 文档',
            accept: { 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'] }
          }]
        });
        boundHandle = handle;
        await idbSet('doc', handle);
        await syncBound(readNotes());
        paintBind();
        showToast('已绑定，之后会自动写入');
      } catch (err) {
        if (err && err.name === 'AbortError') { return; }
        showToast('没能绑定这个文件，换个位置再试');
      }
  });

  if (hasPicker) {
    idbGet('doc').then(function (handle) {
      if (handle) { boundHandle = handle; }
      paintBind();
    }).catch(function () { paintBind(); });
  } else {
    paintBind();
  }

  /* ---------- 复制 ---------- */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('已复制');
      }).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }

    function fallbackCopy() {
      var box = document.createElement('textarea');
      box.value = text;
      box.style.position = 'fixed';
      box.style.opacity = '0';
      document.body.appendChild(box);
      box.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(box);
      showToast(ok ? '已复制' : '复制失败，手动选一下吧');
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (btn) {
    btn.addEventListener('click', function () {
      copyText(btn.getAttribute('data-copy'));
    });
  });

  /* ---------- 点击涟漪 ---------- */
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  document.addEventListener('pointerdown', function (e) {
    if (calm.matches) { return; }
    var size = 40;
    var dot = document.createElement('div');
    dot.className = 'ripple';
    dot.style.left = (e.clientX - size / 2) + 'px';
    dot.style.top = (e.clientY - size / 2) + 'px';
    document.body.appendChild(dot);
    setTimeout(function () { dot.remove(); }, 650);
  });
})();
</script>
</body>
</html>
